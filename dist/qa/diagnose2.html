<!doctype html>
<meta charset="utf-8" />
<title>Flightline QA2</title>
<pre id="out">starting…</pre>
<script type="module">
import { MotionTracker } from '../tracker.js?v=53';
import { FRAME_ENGINES, pickEngine } from '../frame-source.js?v=53';
// The frame-fed engines (v2 by default); ?engine=legacy for the old linker. Unknown names (and hf) throw.
const engine = pickEngine(new URLSearchParams(location.search).get('engine'), FRAME_ENGINES);
const out = document.getElementById('out');
const log = (...a) => { out.textContent += a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n'; };
const video = document.createElement('video');
video.src = 'pxl.mp4';
video.muted = true;
video.playsInline = true;
await new Promise((res, rej) => { video.onloadeddata = res; video.onerror = () => rej(new Error('load fail')); });
const scale = Math.min(1, 1280 / Math.max(video.videoWidth, video.videoHeight));
const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const frames = Math.ceil(video.duration * 30);
const captured = Array.from({ length: frames }, () => null);
log('meta', { w: video.videoWidth, h: video.videoHeight, dur: video.duration, frames, scan: [w, h] });
video.currentTime = 0;
await Promise.race([new Promise(r => video.addEventListener('seeked', r, { once: true })), new Promise(r => setTimeout(r, 1000))]);
await new Promise(resolve => {
  const done = () => { video.pause(); clearTimeout(t); resolve(); };
  const t = setTimeout(done, 15000);
  const pump = () => {
    const mediaTime = video.currentTime;
    const i = Math.max(0, Math.min(frames - 1, Math.round(mediaTime * 30)));
    if (!captured[i]) {
      ctx.drawImage(video, 0, 0, w, h);
      captured[i] = new Uint8ClampedArray(ctx.getImageData(0, 0, w, h).data);
    }
    if (mediaTime >= video.duration - .04 || video.ended) return done();
    video.requestVideoFrameCallback(pump);
  };
  video.requestVideoFrameCallback(pump);
  video.play().catch(done);
});
for (let i = 0; i < frames; i++) {
  if (captured[i]) continue;
  video.currentTime = Math.min(i / 30, video.duration - .002);
  await Promise.race([new Promise(r => video.addEventListener('seeked', r, { once: true })), new Promise(r => setTimeout(r, 1000))]);
  ctx.drawImage(video, 0, 0, w, h);
  captured[i] = new Uint8ClampedArray(ctx.getImageData(0, 0, w, h).data);
}
const tracker = new MotionTracker(w, h, { engine });
const perFrame = [];
for (let i = 0; i < frames; i++) {
  tracker.detect(captured[i], i / 30);
  const cands = (tracker.lastCandidates || []).slice(0, 8).map(c => ({
    x: +c.x?.toFixed?.(3) ?? c.x, y: +c.y?.toFixed?.(3) ?? c.y,
    size: c.size, score: c.score, quality: c.quality, bright: c.brightness
  }));
  if (i >= 45 && i <= 75) perFrame.push({ i, t: +(i / 30).toFixed(3), n: (tracker.lastCandidates || []).length, cands });
}
const result = tracker.result();
// Dump a PNG of frame ~1.73 (index 52)
const idx = 52;
ctx.putImageData(new ImageData(captured[idx], w, h), 0, 0);
const dataUrl = canvas.toDataURL('image/png');
window.__qa2 = {
  engine: tracker.engine,
  count: result.points.length,
  points: result.points,
  perFrame,
  midBright: (() => {
    const f = captured[idx]; let s = 0, n = 0;
    for (let p = 0; p < f.length; p += 4) { s += (f[p]+f[p+1]+f[p+2])/3; n++; }
    return Math.round(s / n);
  })(),
  samplePx: Array.from(captured[idx].slice(0, 12)),
  pngBytes: dataUrl.length
};
log('RESULT', { count: result.points.length, first: result.points[0], last: result.points.at(-1), midBright: window.__qa2.midBright });
log('candsAroundLaunch', perFrame.filter(p => p.n).slice(0, 12));
document.title = `QA2 ${result.points.length} pts`;
out.dataset.done = '1';
// expose frame for download
const a = document.createElement('a'); a.id = 'frameLink'; a.href = dataUrl; a.download = 'browser-frame52.png'; a.textContent = 'frame52'; document.body.appendChild(a);
</script>
