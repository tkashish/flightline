  const to = setTimeout(() => resolve('timeout'), 5000);
  video.addEventListener('seeked', () => { clearTimeout(to); resolve('ok'); }, { once: true });
  video.currentTime = Math.max(0, Math.min(video.duration - .001, t));
});
log('meta', { w: video.videoWidth, h: video.videoHeight, dur: video.duration, frames, seekable: video.seekable.length ? video.seekable.end(0) : 0 });
const captured = [];
for (let i = 0; i < frames; i++) {

  ctx.drawImage(video, 0, 0, w, h);
  captured.push(new Uint8ClampedArray(ctx.getImageData(0, 0, w, h).data));
}

for (let i = 0; i < frames; i++) tracker.detect(captured[i], i / fps);

const path = result.points.map(p => ({ t: +p.t.toFixed(3), x: +(p.x * w).toFixed(1), y: +(p.y * h).toFixed(1) }));

out.dataset.done = '1';
</script>
