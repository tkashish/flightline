<!doctype html>
<meta charset="utf-8" />
<title>Flightline QA5</title>
<pre id="out">starting…</pre>
<script type="module">
import { MotionTracker } from '../tracker.js?v=19';
const out = document.getElementById('out');
const log = (...a) => { out.textContent += a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n'; };
const video = document.createElement('video');
video.src = 'pxl.mp4';
video.muted = true;
video.playsInline = true;
await new Promise((res, rej) => { video.onloadeddata = res; video.onerror = () => rej(new Error('load fail')); });
const seekable = video.seekable?.length ? video.seekable.end(0) : 0;
log('seekable', seekable, 'dur', video.duration);
const scale = Math.min(1, 1280 / Math.max(video.videoWidth, video.videoHeight));
const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const fps = 30, frames = Math.ceil(video.duration * fps);
const seek = t => new Promise((resolve, reject) => {
  const to = setTimeout(() => { clean(); reject(new Error('timeout')); }, 8000);
  const clean = () => { clearTimeout(to); video.removeEventListener('seeked', done); };
  const done = () => { clean(); resolve(); };
  video.addEventListener('seeked', done, { once: true });
  video.currentTime = Math.max(0, Math.min(video.duration - .001, t));
});
const captured = [];
for (let i = 0; i < frames; i++) {
  await seek(Math.min(i / fps, video.duration - .002));
  ctx.drawImage(video, 0, 0, w, h);
  captured.push(new Uint8ClampedArray(ctx.getImageData(0, 0, w, h).data));
  if (i % 20 === 0) log('seek', i);
}
const tracker = new MotionTracker(w, h);
for (let i = 0; i < frames; i++) tracker.detect(captured[i], i / fps);
const result = tracker.result();
window.__qa5 = { count: result.points.length, points: result.points, first: result.points[0], last: result.points.at(-1) };
log('RESULT', window.__qa5);
document.title = `QA5 ${result.points.length} pts`;
out.dataset.done = '1';
</script>
